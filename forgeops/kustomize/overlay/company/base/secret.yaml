apiVersion: kustomize.config.k8s.io/v1beta1
kind: secretAgentConfiguration

metadata:
    name: platform-sac

spec:
    appConfig:
        createKubernetesObjects: true
        secretsManager: none

    secrets:
        - name: platform-secrets
          keys:
              - name: ESV_JWT_PRIVATE_KEY
                type: literal
                spec:
                    isBase64: true
                    value: ''
